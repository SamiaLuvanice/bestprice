[project]
name = "bestprice-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.19.1",
    "cryptography>=46,<48",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
