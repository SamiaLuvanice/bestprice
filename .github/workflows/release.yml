name: Delivery
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Versão opcional (v1.2.3); vazio gera build-SHA
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: delivery-main
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prefix: ${{ steps.release.outputs.prefix }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: release
        env:
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const version = process.env.VERSION || `build-${context.sha.slice(0, 12)}`;
            if (process.env.VERSION && !/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error('Versão deve ser vMAJOR.MINOR.PATCH.');
            }
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: version });
              throw new Error('Release já existe. Não será sobrescrita.');
            } catch (error) { if (error.status !== 404) throw error; }
            try {
              const { data } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${version}` });
              if (data.object.sha !== context.sha) throw new Error('Tag existente aponta para outro commit.');
            } catch (error) { if (error.status !== 404) throw error; }
            core.setOutput('tag', version);
            core.setOutput('prefix', `ghcr.io/${context.repo.owner}/${context.repo.repo}`.toLowerCase());
  quality:
    needs: prepare
    uses: ./.github/workflows/quality.yml
  images:
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.prefix }}-${{ matrix.component }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.prefix }}-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Registrar digest publicado
        env:
          IMAGE: ${{ needs.prepare.outputs.prefix }}-${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" '{image: $image, digest: $digest}' > "$COMPONENT.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.json
          retention-days: 7
  release:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const fs = require('node:fs');
            const images = ['backend', 'frontend'].map(name => JSON.parse(fs.readFileSync(`images/${name}.json`, 'utf8')));
            for (const image of images) {
              if (!/^sha256:[a-f0-9]{64}$/.test(image.digest)) throw new Error('Digest inválido.');
            }
            const body = [`Commit: ${context.sha}`, '', 'Imagens publicadas (use o digest para implantação e rollback):', '',
              ...images.map(image => `- \`${image.image}@${image.digest}\``), '',
              'Backend, frontend e automações passaram nos gates desta execução.',
              'Implantação externa não configurada. Consulte docs/github-workflow.md.'].join('\n');
            await github.rest.repos.createRelease({ ...context.repo,
              tag_name: process.env.RELEASE_TAG, target_commitish: context.sha,
              name: process.env.RELEASE_TAG, body, draft: false, prerelease: false });
            await core.summary.addRaw(body).write();
