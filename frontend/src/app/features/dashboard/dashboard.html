<section class="panel" aria-labelledby="dashboard-title">
  @if (auth.user(); as user) {
    <span class="eyebrow">Página principal</span>
    <h2 id="dashboard-title">Acesso confirmado</h2>
    <p class="intro">Você entrou na sua conta My Bank.</p>
    <dl>
      <dt>E-mail da conta</dt>
      <dd>{{ user.email }}</dd>
    </dl>
    @if (error(); as message) {
      <p role="alert" class="notice">{{ message }}</p>
    }
    <button type="button" (click)="logout()" [disabled]="auth.pending()">
      {{ auth.pending() ? 'Saindo…' : 'Sair' }}
    </button>
  } @else {
    <p role="status">Verificando sua sessão…</p>
  }
</section>
