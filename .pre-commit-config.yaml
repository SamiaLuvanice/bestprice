# Hooks mínimos e genéricos (https://pre-commit.com). Opcional: `pip install pre-commit && pre-commit install`.
# Ruff, pytest, ESLint, Vitest e build ficam em quality-gates/CI.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: guard-protected-branch
        name: bloqueia commit direto em branch integradora
        entry: python scripts/guard-protected-branch.py
        language: system
        stages: [commit-msg]
        pass_filenames: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # .claude/ são links para .agents/ e CLAUDE.md contém só "@AGENTS.md"
        exclude: ^(\.claude/|CLAUDE\.md$)
      - id: check-yaml
      - id: check-json
        # tsconfig pode conter comentários JSONC.
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
