services:
  - type: web
    name: bestprice-stage-api
    runtime: docker
    plan: free
    region: virginia
    branch: stage
    autoDeployTrigger: checksPass
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: /app/start-stage.sh
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: stage
      - key: MERCADOLIVRE_THIRD_PARTY_VALIDATED
        value: "false"
      - key: DATABASE_URL
        sync: false
