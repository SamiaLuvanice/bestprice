services:
  - type: web
    name: bestprice-stage-api
    runtime: docker
    plan: free
    region: virginia
    branch: stage
    autoDeployTrigger: checksPass
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: /app/start-stage.sh
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: stage
      - key: MERCADOLIVRE_THIRD_PARTY_VALIDATED
        value: "false"
      - key: MERCADOLIVRE_REDIRECT_URI
        value: https://bestprice-stage-api.onrender.com/api/marketplace/oauth/callback
      - key: DATABASE_URL
        sync: false
      # Cadastro self-service desligado até a leitura de anúncios funcionar (spec 0048).
      - key: SIGNUP_ENABLED
        value: "false"
      - key: TRUSTED_PROXY_SECRET
        sync: false
      - key: SIGNUP_SOURCE_HASH_SECRET
        sync: false
