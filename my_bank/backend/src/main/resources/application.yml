spring:
  application:
    name: my-bank
  # Datas em UTC na API (rules/datetime-pipeline.md)
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    # Evita consultas ao banco durante a renderização da resposta
    open-in-view: false
bank:
  auth:
    email: ${BANK_AUTH_EMAIL:}
    password: ${BANK_AUTH_PASSWORD:}
server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        path: /
        secure: false
  error:
    include-stacktrace: never
    include-message: never
