# Profile "docker": PostgreSQL em vez do H2 em memória. Valores vêm do ambiente (.env).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Projeto de estudos: o Hibernate ajusta o schema. Para produção, troque por migrations (Flyway).
      ddl-auto: update
