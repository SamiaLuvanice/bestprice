server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # A API vive no backend; o prefixo /api é mantido (igual ao proxy do ng serve).
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA: qualquer rota do Angular cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
